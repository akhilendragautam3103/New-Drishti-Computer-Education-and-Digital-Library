.logo small{

    display:block;

    color:#555;

.back-btn{

    color:white;

    padding:10px 18px;

    border-radius:25px;

/* ==============================
   MAIN
============================== */

.container{

    width:95%;

    max-width:1250px;

    margin:25px auto;

}


/* ==============================
   TEST HEADER
============================== */

.test-header{

    background:white;

    padding:20px;

    border-radius:18px;

    margin-bottom:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.2);

}

.test-header h1{

    color:#4b2aad;

    margin-bottom:5px;

}

.test-header p{

    color:#666;

}


/* ==============================
   TIMER
============================== */

.timer{

    background:#e53935;

    color:white;

    padding:12px 25px;

    border-radius:30px;

    font-size:21px;

    font-weight:bold;

    min-width:130px;

    text-align:center;

}


/* =================================================
   IMPORTANT MAIN QUIZ LAYOUT
================================================= */

.quiz-layout{

    display:grid;

    grid-template-columns:
    minmax(0,1fr) 300px;

    gap:25px;

    align-items:start;

}


/* ==============================
   LEFT QUESTION BOX
============================== */

.question-box{

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.2);

    min-height:500px;

}

.question-number{

    color:#764ba2;

    font-size:17px;

    font-weight:bold;

    margin-bottom:15px;

}

.question{

    font-size:21px;

    font-weight:bold;

    line-height:1.5;

    margin-bottom:25px;

}


/* ==============================
   OPTIONS
============================== */

.options{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.option{

    display:block;

    border:2px solid #ddd;

    padding:16px;

    border-radius:12px;

    cursor:pointer;

    background:#fafafa;

    transition:.2s;

    font-size:16px;

}

.option:hover{

    border-color:#764ba2;

    background:#f3efff;

}

.option.selected{

    border-color:#4b2aad;

    background:#eee8ff;

    font-weight:bold;

}

.option input{

    margin-right:10px;

}


/* ==============================
   NAVIGATION
============================== */

.navigation{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-top:30px;

    flex-wrap:wrap;

}

.nav-btn{

    border:none;

    padding:13px 22px;

    border-radius:25px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}

.previous{

    background:#777;

}

.next{

    background:#4b2aad;

}

.submit{

    background:#e53935;

}

.nav-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =================================================
   RIGHT SIDE QUESTION PALETTE
================================================= */

.palette{

    background:white;

    padding:20px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.2);

    position:sticky;

    top:90px;

    width:100%;

}

.palette h3{

    text-align:center;

    color:#4b2aad;

    margin-bottom:18px;

    font-size:20px;

}


/* ==============================
   QUESTION NUMBERS
============================== */

.question-buttons{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:10px;

}

.question-buttons button{

    width:42px;

    height:42px;

    border:none;

    border-radius:8px;

    background:#e0e0e0;

    color:#222;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;

    transition:.2s;

}

.question-buttons button:hover{

    transform:scale(1.08);

}


/* CURRENT */

.question-buttons button.active{

    background:#4b2aad;

    color:white;

}


/* ANSWERED */

.question-buttons button.answered{

    background:#2e7d32;

    color:white;

}

   LEGEND
============================== */

.legend{

    margin-top:20px;

    border-top:1px solid #ddd;

    padding-top:15px;

}

.legend-item{

    display:flex;

    gap:10px;

    font-size:14px;

.legend-box{

    width:20px;

    height:20px;

    background:#e0e0e0;

}

.legend-box.current{

    background:#4b2aad;

}

.legend-box.answered{

    background:#2e7d32;

/* =====================================

let currentQuestion = 0;

let userAnswers =
new Array(questions.length).fill(null);

let timeLeft = 30 * 60;

let timerInterval;


/* =====================================
   CREATE PALETTE
===================================== */

function createPalette(){

    const container =
    document.getElementById(
        "questionButtons"
    );

    container.innerHTML="";


    questions.forEach(
        (q,index)=>{

            const btn =
            document.createElement("button");

            btn.innerText =
            index + 1;

            btn.id =
            "qbtn-" + index;


            btn.onclick=function(){

                currentQuestion=index;

                showQuestion();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            };


            container.appendChild(btn);

        }
    );

}


/* =====================================
   SHOW QUESTION
===================================== */

function showQuestion(){

    const q =
    questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).innerText=

    "Question " +
    (currentQuestion+1) +
    " of " +
    questions.length;


    document.getElementById(
        "question"
    ).innerText=q.question;


    const options =
    document.getElementById(
        "options"
    );

    options.innerHTML="";


    q.options.forEach(
        (option,index)=>{

            const label =
            document.createElement("label");

            label.className="option";


            if(
                userAnswers[
                    currentQuestion
                ]===index
            ){

                label.classList.add(
                    "selected"
                );

            }


            label.innerHTML=`

                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${
                        userAnswers[
                            currentQuestion
                        ]===index
                        ? "checked"
                        : ""
                    }
                >

                ${option}

            `;


            label.onclick=function(){

                userAnswers[
                    currentQuestion
                ]=index;


                document
                .querySelectorAll(
                    ".option"
                )
                .forEach(
                    el=>{
                        el.classList.remove(
                            "selected"
                        );
                    }
                );


                label.classList.add(
                    "selected"
                );


                updatePalette();

            };


            options.appendChild(label);

        }
    );


    updatePalette();


    document.getElementById(
        "previousBtn"
    ).disabled=
    currentQuestion===0;


    document.getElementById(
        "nextBtn"
    ).style.display=

    currentQuestion===
    questions.length-1

    ? "none"
    : "inline-block";

}


/* =====================================
   UPDATE PALETTE
===================================== */

function updatePalette(){

    questions.forEach(
        (q,index)=>{

            const btn =
            document.getElementById(
                "qbtn-"+index
            );


            btn.classList.remove(
                "active"
            );

            btn.classList.remove(
                "answered"
            );


            if(
                index===currentQuestion
            ){

                btn.classList.add(
                    "active"
                );

            }


            if(
                userAnswers[index]!==null
            ){

                btn.classList.add(
                    "answered"
                );

            }

        }
    );

}


/* =====================================
   NEXT
===================================== */

function nextQuestion(){

    if(
        currentQuestion<
        questions.length-1
    ){

        currentQuestion++;

        showQuestion();

    }

}


/* =====================================
   PREVIOUS
===================================== */

function previousQuestion(){

    if(
        currentQuestion>0
    ){

        currentQuestion--;

        showQuestion();

    }

}


/* =====================================
   TIMER
===================================== */

function startTimer(){

    timerInterval=
    setInterval(()=>{

        let minutes =
        Math.floor(
            timeLeft/60
        );

        let seconds =
        timeLeft%60;


        document.getElementById(
            "timer"
        ).innerText=

        String(minutes)
        .padStart(2,"0")
        +":"+
        String(seconds)
        .padStart(2,"0");


        if(
            timeLeft<=0
        ){

            clearInterval(
                timerInterval
            );

            alert(
                "⏰ समय समाप्त हो गया है!"
            );

            submitTest();

            return;

        }


        timeLeft--;

    },1000);

}


/* =====================================
   SUBMIT
===================================== */

function submitTest(){

    clearInterval(
        timerInterval
    );


    let correct=0;

    let wrong=0;

    let unanswered=0;


    questions.forEach(
        (q,index)=>{

            if(
                userAnswers[index]===null
            ){

                unanswered++;

            }

            else if(
                userAnswers[index]===
                q.answer
            ){

                correct++;

            }

            else{

                wrong++;

            }

        }
    );


    const percentage=
    Math.round(
        (correct/
        questions.length)*100
    );


    document.getElementById(
        "quizBox"
    ).style.display="none";


    document.getElementById(
        "palette"
    ).style.display="none";


    document.getElementById(
        "result"
    ).style.display="block";


    document.getElementById(
        "score"
    ).innerText=

    correct+
    " / "+
    questions.length;


    document.getElementById(
        "percentage"
    ).innerText=

    "Percentage: "+
    percentage+"%";


    document.getElementById(
        "correct"
    ).innerText=

    "Correct: "+correct;


    document.getElementById(
        "wrong"
    ).innerText=

    "Wrong: "+wrong;


    document.getElementById(
        "unanswered"
    ).innerText=

    "Unanswered: "+
    unanswered;

}


/* =====================================
   RESTART
===================================== */

function restartTest(){

    location.reload();

}


/* =====================================
   START TEST
===================================== */

createPalette();

showQuestion();

startTimer();

</script>
