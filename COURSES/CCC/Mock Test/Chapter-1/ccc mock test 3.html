<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CCC Mock Test 2 | New Drishti</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e0f2fe,#f5f3ff);color:#222}.header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;text-align:center;padding:20px}.header h1{margin:0}.test-box{max-width:850px;margin:30px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 10px 30px #0002}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}.timer{background:#fee2e2;color:#b91c1c;padding:10px 18px;border-radius:10px;font-weight:bold}.progress{background:#e5e7eb;height:10px;border-radius:10px;overflow:hidden;margin-bottom:25px}.progress-bar{height:100%;background:#2563eb;transition:.3s}.question{font-size:20px;font-weight:bold;margin-bottom:20px}.option{display:block;border:2px solid #ddd;padding:13px;margin:10px 0;border-radius:10px;cursor:pointer;transition:.2s}.option:hover{border-color:#2563eb;background:#eff6ff}.option input{margin-right:10px}.buttons{display:flex;justify-content:space-between;gap:8px;margin-top:25px;flex-wrap:wrap}button{border:0;padding:12px 22px;border-radius:10px;color:#fff;background:#2563eb;cursor:pointer;font-weight:bold}#prev{background:#64748b}#submit{background:#16a34a}.result{display:none;text-align:center;padding:30px}.score{font-size:40px;font-weight:bold;color:#16a34a}
</style></head><body>
<div class="header"><h1>💻 NEW DRISHTI</h1><p>CCC Mock Test 2</p></div>
<div class="test-box">
<div class="top"><strong id="questionNo"></strong><div class="timer">⏱ Time: <span id="time"></span></div></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div id="quiz"></div>
<div class="buttons"><button id="prev" onclick="previousQuestion()">← Previous</button><button id="next" onclick="nextQuestion()">Next →</button><button id="submit" onclick="submitTest()">Submit Test</button></div>
<div class="result" id="result"><h2>🎉 Test Completed!</h2><p>Your Score</p><div class="score" id="score"></div><p id="message"></p><button onclick="location.reload()">🔄 Retake Test</button></div>
</div>
<script>
const questions=[["ALU का मुख्य कार्य क्या है?", ["Arithmetic और Logical operations", "Printing", "Internet", "Storage"], 0], ["1 Byte में कितने bits होते हैं?", ["4", "8", "16", "32"], 1], ["कौन सा input device है?", ["Monitor", "Printer", "Keyboard", "Speaker"], 2], ["कौन सा output device है?", ["Scanner", "Keyboard", "Monitor", "Mouse"], 2], ["ROM में data कैसा रहता है?", ["अस्थायी", "स्थायी", "केवल online", "केवल RAM में"], 1], ["Windows में files manage करने के लिए क्या उपयोग होता है?", ["File Explorer", "Paint", "Calculator", "Notepad"], 0], ["MS Word में text को मोटा करने का shortcut क्या है?", ["Ctrl+B", "Ctrl+I", "Ctrl+U", "Ctrl+M"], 0], ["MS Word में underline का shortcut क्या है?", ["Ctrl+B", "Ctrl+I", "Ctrl+U", "Ctrl+L"], 2], ["Excel में formula किस चिन्ह से शुरू होता है?", ["#", "=", "@", "$"], 1], ["Excel में rows को किससे पहचाना जाता है?", ["Letters", "Numbers", "Symbols", "Colors"], 1], ["Excel में columns को किससे पहचाना जाता है?", ["Numbers", "Letters", "Dates", "Icons"], 1], ["PowerPoint में एक page को क्या कहते हैं?", ["Sheet", "Slide", "Cell", "Frame"], 1], ["Browser में website का address कहाँ लिखा जाता है?", ["Status bar", "Address bar", "Taskbar", "Title bar"], 1], ["HTTP का संबंध किससे है?", ["Web communication", "Printing", "Typing", "Sound"], 0], ["Email भेजने के लिए किसकी आवश्यकता होती है?", ["Email address", "Printer", "Scanner", "Projector"], 0], ["Spam email क्या होता है?", ["अनचाहा email", "महत्वपूर्ण email", "Draft email", "Sent email"], 0], ["Cloud storage का उदाहरण कौन सा है?", ["Google Drive", "Keyboard", "CPU", "Monitor"], 0], ["Digital payment का उदाहरण कौन सा है?", ["UPI", "Paint", "Notepad", "BIOS"], 0], ["OTP का पूरा नाम क्या है?", ["One Time Password", "Only Transfer Password", "Online Text Password", "One Type Program"], 0], ["Antivirus का उपयोग किसलिए होता है?", ["Malware से सुरक्षा", "Typing", "Presentation", "Printing"], 0]];
let current=0,answers=new Array(questions.length).fill(null),timeLeft=1200;
function showQuestion(){
 const q=questions[current];
 document.getElementById("questionNo").innerText="Question "+(current+1)+" / "+questions.length;
 document.getElementById("progressBar").style.width=((current+1)/questions.length*100)+"%";
 let html='<div class="question">'+(current+1)+'. '+q[0]+'</div>';
 q[1].forEach((o,i)=>{html+='<label class="option"><input type="radio" name="answer" value="'+i+'" '+(answers[current]===i?'checked':'')+' onchange="answers[current]='+i+'">'+o+'</label>'; });
 document.getElementById("quiz").innerHTML=html;
 document.getElementById("prev").style.visibility=current===0?"hidden":"visible";
 document.getElementById("next").style.display=current===questions.length-1?"none":"block";
 document.getElementById("submit").style.display=current===questions.length-1?"block":"none";
}
function nextQuestion(){if(current<questions.length-1){current++;showQuestion()}}
function previousQuestion(){if(current>0){current--;showQuestion()}}
function submitTest(){
 let score=questions.reduce((s,q,i)=>s+(answers[i]===q[2]?1:0),0);
 document.getElementById("quiz").style.display="none";
 document.querySelector(".buttons").style.display="none";
 document.querySelector(".progress").style.display="none";
 document.querySelector(".top").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("score").innerText=score+" / "+questions.length;
 let p=score/questions.length*100;
 document.getElementById("message").innerText=p>=80?"🌟 Excellent Performance!":p>=60?"👍 Very Good! Keep Practicing.":p>=40?"🙂 Good! More Practice Required.":"📚 Keep Practicing and Try Again.";
}
function timer(){
 let m=Math.floor(timeLeft/60),s=timeLeft%60;
 document.getElementById("time").innerText=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 if(timeLeft<=0){submitTest();return} timeLeft--;
}
showQuestion();timer();setInterval(timer,1000);
</script></body></html>
